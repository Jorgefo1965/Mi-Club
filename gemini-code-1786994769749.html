<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Lo Arcaya Pro v6.5 - Club Ecuestre</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        tailwind.config = { theme: { extend: { colors: { 
            hipo: { bg: '#0d1410', card: '#15201a', cardLight: '#23332a', accent: '#7a9e85', accentHover: '#5e7d67', border: '#2c3e33', textMuted: '#8a9e90', success: '#10b981', warning: '#f59e0b', danger: '#ef4444', purple: '#a855f7' } 
        }}}}
    </script>
    <style>
        body { background-color: #0d1410; color: white; -webkit-tap-highlight-color: transparent; font-family: system-ui, -apple-system, sans-serif; }
        .bottom-nav-active { color: #7a9e85 !important; border-top: 2px solid #7a9e85; background-color: rgba(122, 158, 133, 0.08); }
        select, input, textarea { background-color: #0d1410 !important; border-color: #2c3e33 !important; color: white !important; }
        .modal-backdrop { background-color: rgba(13, 20, 16, 0.92); backdrop-filter: blur(6px); }
        input[type="date"]::-webkit-calendar-picker-indicator { filter: invert(0.8) sepia(1) saturate(3) hue-rotate(90deg); cursor: pointer; padding: 4px; }
    </style>
</head>
<body class="pb-20 pt-2 px-3 md:px-6 font-sans antialiased text-slate-100">

    <!-- SECCIÓN PERSONAS (MANTENIENDO LOGIN Y APPCONTAINER IGUALES) -->
    <!-- (El resto del HTML sigue igual que tu v6.4, insertamos las mejoras aquí) -->

    <!-- [ LOGIN y HEADER permanecen idénticos, omitidos por brevedad ] -->

    <main id="secPeople" class="space-y-3 hidden">
        <div class="flex justify-between items-center gap-2">
            <div class="grid grid-cols-4 gap-1 bg-hipo-card p-1.5 rounded-xl border border-hipo-border text-[10px] flex-1">
                <button id="filterPeopleAll" class="py-1.5 rounded-lg font-bold bg-hipo-accent text-hipo-bg">Todos</button>
                <button id="filterPeopleSocio" class="py-1.5 rounded-lg font-bold bg-hipo-bg text-hipo-textMuted">Socios</button>
                <button id="filterPeopleDuenos" class="py-1.5 rounded-lg font-bold bg-hipo-bg text-hipo-textMuted">Dueños</button>
                <button id="filterPeopleStaff" class="py-1.5 rounded-lg font-bold bg-hipo-bg text-hipo-textMuted">Staff</button>
            </div>
            <button onclick="openPersonaModal()" class="bg-hipo-accent hover:bg-hipo-accentHover text-hipo-bg font-black px-3 py-2.5 rounded-xl text-xs shrink-0 shadow-md">
                ➕ Nueva Persona
            </button>
        </div>
        <input type="text" id="searchPersona" placeholder="🔍 Buscar nombre..." class="w-full p-2.5 rounded-xl text-xs border">
        <div id="personasGrid" class="space-y-2.5"></div>
    </main>

    <!-- MODAL PERSONA (ACTUALIZADO CON STAFF) -->
    <div id="personaModal" class="fixed inset-0 modal-backdrop hidden z-50 flex items-center justify-center p-3">
        <div class="bg-hipo-card w-full max-w-md rounded-2xl border border-hipo-border p-4 space-y-3 shadow-2xl max-h-[90vh] overflow-y-auto">
            <form id="personaForm" class="space-y-3 text-xs">
                <input type="hidden" id="personaId">
                <div class="grid grid-cols-2 gap-2 bg-hipo-bg p-2 rounded-xl border border-hipo-border">
                    <label class="flex items-center gap-1"><input type="checkbox" id="chkEsSocio"> Socio</label>
                    <label class="flex items-center gap-1"><input type="checkbox" id="chkEsPropietario"> Dueño</label>
                    <label class="flex items-center gap-1"><input type="checkbox" id="chkEsStaff" onchange="toggleStaffFields()"> 💼 Staff</label>
                </div>

                <div id="staffFields" class="hidden grid grid-cols-2 gap-2 bg-purple-900/20 p-2 rounded-xl border border-hipo-purple/30">
                    <div>
                        <label class="block text-hipo-purple font-bold">Rol</label>
                        <select id="pStaffRol" class="w-full p-1.5 rounded-lg">
                            <option>Profesor</option><option>Ordenanza</option><option>Veterinario</option><option>Herrero</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-hipo-purple font-bold">Condición</label>
                        <select id="pStaffCond" class="w-full p-1.5 rounded-lg">
                            <option>Interno</option><option>Externo</option>
                        </select>
                    </div>
                </div>
                <!-- [ RESTO DE CAMPOS (Nombre, RUT, etc) SIGUEN IGUAL ] -->
                <button type="submit" class="w-full bg-hipo-accent p-2.5 rounded-xl font-black text-xs">💾 Guardar</button>
            </form>
        </div>
    </div>

    <script>
        // [ INSERTAR TU LÓGICA EXISTENTE AQUÍ ]
        
        function toggleStaffFields() {
            const isStaff = document.getElementById('chkEsStaff').checked;
            document.getElementById('staffFields').classList.toggle('hidden', !isStaff);
        }

        // Al renderPeople:
        // Incluir lógica para filtrar por p.es_staff
        // Incluir badges para Staff (Interno/Externo) en el HTML del grid
    </script>
</body>
</html>
