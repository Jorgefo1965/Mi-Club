<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Lo Arcaya Pro v6.6 - Club Ecuestre</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        hipo: {
                            bg: '#0d1410',
                            card: '#15201a',
                            cardLight: '#23332a',
                            accent: '#7a9e85',
                            accentHover: '#5e7d67',
                            border: '#2c3e33',
                            textMuted: '#8a9e90',
                            success: '#10b981',
                            warning: '#f59e0b',
                            danger: '#ef4444',
                            purple: '#a855f7',
                            blue: '#3b82f6'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #0d1410; color: white; -webkit-tap-highlight-color: transparent; font-family: system-ui, -apple-system, sans-serif; }
        .bottom-nav-active { color: #7a9e85 !important; border-top: 2px solid #7a9e85; background-color: rgba(122, 158, 133, 0.08); }
        select, input, textarea { background-color: #0d1410 !important; border-color: #2c3e33 !important; color: white !important; }
        .modal-backdrop { background-color: rgba(13, 20, 16, 0.92); backdrop-filter: blur(6px); }
        input[type="date"]::-webkit-calendar-picker-indicator {
            filter: invert(0.8) sepia(1) saturate(3) hue-rotate(90deg);
            cursor: pointer; padding: 4px;
        }
    </style>
</head>
<body class="pb-20 pt-2 px-3 md:px-6 font-sans antialiased text-slate-100">

    <!-- LOGIN -->
    <div id="loginScreen" class="fixed inset-0 bg-hipo-bg z-50 flex items-center justify-center p-4">
        <div class="bg-hipo-card w-full max-w-sm p-6 rounded-2xl border border-hipo-border space-y-4 shadow-2xl text-center">
            <img src="logo.png" alt="Lo Arcaya" class="w-16 h-16 rounded-full object-cover mx-auto border-2 border-hipo-accent shadow-lg">
            <div>
                <h2 class="text-xl font-black text-white">Lo Arcaya</h2>
                <span class="text-xs text-hipo-textMuted">Club Ecuestre • Acceso Privado</span>
            </div>

            <form id="loginForm" class="space-y-3 text-left">
                <div>
                    <label class="block text-xs text-hipo-textMuted mb-1 font-bold">Perfil / Usuario</label>
                    <select id="loginRole" class="w-full p-2.5 rounded-xl text-xs font-bold text-white border">
                        <option value="admin">👑 Administrador (Clave: admin123)</option>
                        <option value="profe">🎓 Profesor (Clave: profe123)</option>
                        <option value="ordenanza">🧹 Ordenanza (Clave: pesebrera123)</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs text-hipo-textMuted mb-1 font-bold">Contraseña</label>
                    <input type="password" id="loginPass" placeholder="Ingresa tu clave" required class="w-full p-2.5 rounded-xl text-xs border">
                </div>
                <div id="loginError" class="text-hipo-danger text-[11px] font-bold hidden">❌ Usuario o contraseña incorrecta.</div>
                <button type="submit" class="w-full bg-hipo-accent hover:bg-hipo-accentHover text-hipo-bg font-black py-3 rounded-xl text-xs transition-colors shadow-md">
                    🔑 Ingresar al Club
                </button>
            </form>
        </div>
    </div>

    <!-- APP PRINCIPAL -->
    <div id="appContainer" class="max-w-4xl mx-auto space-y-3 hidden">
        <header class="bg-hipo-card p-3 rounded-2xl border border-hipo-border flex items-center justify-between shadow-lg">
            <div class="flex items-center gap-3">
                <img src="logo.png" alt="Lo Arcaya" class="w-10 h-10 rounded-full object-cover shadow-md shrink-0 border border-hipo-border/60">
                <div>
                    <div class="flex items-center gap-1.5">
                        <h1 class="text-base font-black text-white tracking-tight leading-none">Lo Arcaya</h1>
                        <span id="cloudStatus" class="w-2 h-2 rounded-full bg-hipo-success inline-block shadow-[0_0_8px_#10b981]"></span>
                    </div>
                    <span class="text-[10px] text-hipo-textMuted font-medium">Club Ecuestre • v6.6 Pro</span>
                </div>
            </div>
            <div class="flex items-center gap-1">
                <button id="btnLogout" class="bg-hipo-danger/25 text-hipo-danger border border-hipo-danger/40 text-xs px-2.5 py-1.5 rounded-xl font-bold flex items-center gap-1"><span>🚪</span> <span id="lblCurrentRoleText">Salir</span></button>
            </div>
        </header>

        <div id="roleBanner" class="bg-hipo-accent/10 border border-hipo-accent/30 p-2.5 rounded-xl text-xs flex items-center justify-between">
            <span id="roleBannerText" class="font-bold text-hipo-accent text-[11px]">👑 Modo Admin</span>
        </div>

        <main id="secDash" class="space-y-3">
            <div class="grid grid-cols-2 gap-2.5">
                <div onclick="showSection('horses')" class="bg-hipo-card p-3 rounded-2xl border border-hipo-border cursor-pointer"><span class="text-[10px] text-hipo-textMuted uppercase font-bold block">Caballos Activos</span><span id="dashHorseCount" class="text-xl font-black text-white">...</span></div>
                <div onclick="showSection('camion')" class="bg-hipo-card p-3 rounded-2xl border border-hipo-border cursor-pointer"><span class="text-[10px] text-hipo-textMuted uppercase font-bold block">Campeonatos</span><span id="dashChampCount" class="text-xl font-black text-hipo-blue">...</span></div>
            </div>
        </main>

        <main id="secCamion" class="space-y-3 hidden">
            <div class="flex justify-between items-center gap-2">
                <h2 class="font-bold text-xs text-hipo-blue flex items-center gap-1.5"><span>🚚</span> Campeonatos y Logística de Camión</h2>
                <button id="btnOpenNewCampeonatoModal" class="bg-hipo-blue hover:bg-hipo-blue/80 text-white font-black px-3 py-2 rounded-xl text-xs shadow-md">➕ Crear Campeonato</button>
            </div>
            <div id="campeonatosList" class="space-y-3"></div>
        </main>

        <main id="secOrdenanza" class="space-y-3 hidden">
            <div class="bg-hipo-card p-3.5 rounded-2xl border border-hipo-border space-y-3">
                <h2 class="font-bold text-xs text-hipo-accent">⏰ Pesebrera & Operaciones</h2>
            </div>
        </main>

        <main id="secHorses" class="space-y-3 hidden"><div id="horsesGrid"></div></main>
        <main id="secCampaigns" class="space-y-3 hidden"><div id="campaignsActiveList"></div></main>
        <main id="secPeople" class="space-y-3 hidden"><div id="personasGrid"></div></main>
        <main id="secAgenda" class="space-y-3 hidden"><div id="agendaList"></div></main>
        <main id="secFinance" class="space-y-3 hidden"><div id="financeContent"></div></main>

        <!-- NAVEGACIÓN -->
        <nav class="fixed bottom-0 left-0 right-0 bg-hipo-card/95 backdrop-blur-md border-t border-hipo-border py-1.5 px-1 flex items-center justify-around z-40">
            <button id="navDash" class="flex flex-col items-center text-[9px] font-bold bottom-nav-active py-1 px-1 rounded-lg">📊 Inicio</button>
            <button id="navCamion" class="flex flex-col items-center text-[9px] font-bold py-1 px-1 rounded-lg">🚚 Camión</button>
            <button id="navOrdenanza" class="flex flex-col items-center text-[9px] font-bold py-1 px-1 rounded-lg">🧹 Pesebrera</button>
            <button id="navHorses" class="flex flex-col items-center text-[9px] font-bold py-1 px-1 rounded-lg">🐎 Cuadra</button>
            <button id="navCampaigns" class="flex flex-col items-center text-[9px] font-bold py-1 px-1 rounded-lg">💉 Campañas</button>
            <button id="navPeople" class="flex flex-col items-center text-[9px] font-bold py-1 px-1 rounded-lg">👥 Personas</button>
            <button id="navAgenda" class="flex flex-col items-center text-[9px] font-bold py-1 px-1 rounded-lg">📅 Clases</button>
            <button id="navFinance" class="flex flex-col items-center text-[9px] font-bold py-1 px-1 rounded-lg">💰 Cuentas</button>
        </nav>

        <!-- MODAL CAMPEONATO -->
        <div id="campeonatoModal" class="fixed inset-0 modal-backdrop hidden z-50 flex items-center justify-center p-3">
            <div class="bg-hipo-card w-full max-w-md rounded-2xl p-4 space-y-3 border border-hipo-border shadow-2xl">
                <div class="flex justify-between items-center border-b border-hipo-border pb-2">
                    <h3 class="text-xs font-bold text-white">🏆 Crear Nuevo Campeonato</h3>
                    <button id="btnCloseCampeonatoModal" class="text-hipo-textMuted text-lg font-bold">&times;</button>
                </div>
                <form id="campeonatoForm" class="space-y-2.5 text-xs">
                    <div>
                        <label class="block text-hipo-textMuted mb-1 font-bold">Nombre del Campeonato</label>
                        <input type="text" id="campNombre" required placeholder="Ej: Concurso Oficial Primavera" class="w-full p-2 rounded-xl text-xs font-bold border">
                    </div>
                    <div class="grid grid-cols-2 gap-2">
                        <div>
                            <label class="block text-hipo-textMuted mb-1 font-bold">Fecha Inicio</label>
                            <input type="date" id="campInicio" required class="w-full p-2 rounded-xl text-xs border">
                        </div>
                        <div>
                            <label class="block text-hipo-textMuted mb-1 font-bold">Fecha Fin</label>
                            <input type="date" id="campFin" required class="w-full p-2 rounded-xl text-xs border">
                        </div>
                    </div>
                    <div>
                        <label class="block text-hipo-textMuted mb-1 font-bold">Ubicación / Club</label>
                        <input type="text" id="campUbicacion" placeholder="Ej: Club San Cristóbal" class="w-full p-2 rounded-xl text-xs border">
                    </div>
                    <button type="submit" class="w-full bg-hipo-blue text-white font-black p-2.5 rounded-xl text-xs shadow-md">✔ Guardar Campeonato</button>
                </form>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://dvklysnihmioubsswxdw.supabase.co";
        const SUPABASE_KEY = "sb_publishable_4H8CuDflAdSxPSGdx3X4MQ_YQ-SbVPg";
        const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        
        const ROLES_PASS = { admin: "admin123", profe: "profe123", ordenanza: "pesebrera123" };
        let currentRole = 'admin';
        let horses = [], personas = [], campeonatos = [];

        async function fetchCloudData() {
            try {
                const { data: pData } = await db.from('personas').select('*');
                if(pData) personas = pData;

                const { data: champData } = await db.from('campeonatos').select('*').order('fecha_inicio', { ascending: false });
                if(champData) campeonatos = champData;

                const { data: hData } = await db.from('caballos').select('*');
                if(hData) horses = hData;
            } catch(err) {
                console.error("Error cargando datos:", err);
            }
            renderAll();
        }

        function renderAll() {
            document.getElementById('dashHorseCount').textContent = horses.filter(h => h.activo !== false).length;
            document.getElementById('dashChampCount').textContent = campeonatos.length;
            renderCamion();
        }

        function renderCamion() {
            const container = document.getElementById('campeonatosList');
            container.innerHTML = '';
            if (campeonatos.length === 0) {
                container.innerHTML = `<div class="bg-hipo-card p-4 rounded-xl border border-hipo-border text-center text-xs text-hipo-textMuted">No hay campeonatos registrados. Crea uno nuevo con el botón superior.</div>`;
                return;
            }
            campeonatos.forEach(camp => {
                const div = document.createElement('div');
                div.className = "bg-hipo-card p-4 rounded-2xl border border-hipo-border space-y-2 shadow-lg";
                div.innerHTML = `
                    <div class="flex justify-between items-center">
                        <h3 class="font-black text-sm text-white">🏆 ${camp.nombre}</h3>
                        <span class="text-[10px] bg-hipo-blue/20 text-hipo-blue px-2 py-0.5 rounded font-bold">${camp.ubicacion || 'Club'}</span>
                    </div>
                    <span class="text-xs text-hipo-textMuted block">📅 Del ${camp.fecha_inicio} al ${camp.fecha_fin}</span>
                `;
                container.appendChild(div);
            });
        }

        function showSection(sec) {
            ['Dash', 'Camion', 'Ordenanza', 'Horses', 'Campaigns', 'People', 'Agenda', 'Finance'].forEach(s => {
                const el = document.getElementById('sec' + s);
                if(el) el.classList.add('hidden');
            });
            const target = document.getElementById('sec' + sec.charAt(0).toUpperCase() + sec.slice(1));
            if(target) target.classList.remove('hidden');

            ['Dash', 'Camion', 'Ordenanza', 'Horses', 'Campaigns', 'People', 'Agenda', 'Finance'].forEach(s => {
                const btn = document.getElementById('nav' + s);
                if(btn) btn.classList.remove('bottom-nav-active');
            });
            const navBtn = document.getElementById('nav' + sec.charAt(0).toUpperCase() + sec.slice(1));
            if(navBtn) navBtn.classList.add('bottom-nav-active');
        }

        // --- MANEJADOR DE LOGIN CORREGIDO ---
        document.getElementById('loginForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const role = document.getElementById('loginRole').value;
            const pass = document.getElementById('loginPass').value.trim();

            if (ROLES_PASS[role] === pass) {
                currentRole = role;
                document.getElementById('loginError').classList.add('hidden');
                document.getElementById('loginScreen').classList.add('hidden');
                document.getElementById('appContainer').classList.remove('hidden');
                document.getElementById('lblCurrentRoleText').textContent = role.toUpperCase();
                document.getElementById('roleBannerText').textContent = `👑 Modo ${role.toUpperCase()}: Acceso Concedido`;
                fetchCloudData();
            } else {
                document.getElementById('loginError').classList.remove('hidden');
            }
        });

        document.getElementById('btnLogout').addEventListener('click', () => {
            document.getElementById('appContainer').classList.add('hidden');
            document.getElementById('loginScreen').classList.remove('hidden');
            document.getElementById('loginPass').value = '';
        });

        // --- MANEJADOR DE CREAR CAMPEONATO ---
        document.getElementById('campeonatoForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const nombreVal = document.getElementById('campNombre').value.trim();
            const inicioVal = document.getElementById('campInicio').value;
            const finVal = document.getElementById('campFin').value;
            const ubicacionVal = document.getElementById('campUbicacion').value.trim();

            if (!nombreVal || !inicioVal || !finVal) {
                alert("⚠️ Por favor completa los campos obligatorios.");
                return;
            }

            const payload = { 
                nombre: nombreVal, 
                fecha_inicio: inicioVal, 
                fecha_fin: finVal, 
                ubicacion: ubicacionVal || 'Club Ecuestre', 
                estado: 'activo' 
            };

            const { data, error } = await db.from('campeonatos').insert([payload]);
            
            if (error) {
                alert("❌ Error al guardar en Supabase: " + error.message);
                console.error(error);
                return;
            }

            document.getElementById('campeonatoModal').classList.add('hidden');
            document.getElementById('campeonatoForm').reset();
            fetchCloudData();
        });

        document.getElementById('btnOpenNewCampeonatoModal').onclick = () => document.getElementById('campeonatoModal').classList.remove('hidden');
        document.getElementById('btnCloseCampeonatoModal').onclick = () => document.getElementById('campeonatoModal').classList.add('hidden');

        document.getElementById('navDash').onclick = () => showSection('dash');
        document.getElementById('navCamion').onclick = () => showSection('camion');
        document.getElementById('navOrdenanza').onclick = () => showSection('ordenanza');
        document.getElementById('navHorses').onclick = () => showSection('horses');
        document.getElementById('navCampaigns').onclick = () => showSection('campaigns');
        document.getElementById('navPeople').onclick = () => showSection('people');
        document.getElementById('navAgenda').onclick = () => showSection('agenda');
        document.getElementById('navFinance').onclick = () => showSection('finance');
    </script>
</body>
</html>
